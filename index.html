<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Anagram HR</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 1em auto;
            padding: 1em;
            background: #fff;
            color: #000;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #121313; color: #eee; }
            #output { background: #1e1e1e !important; color: #eee !important; }
            #progressContainer { background: #333 !important; }
            input { background: #222; color: #eee; border-color: #444; }
        }
        input, button {
            font-size: 1.1em;
            padding: .7em;
            width: 100%;
            margin: .5em 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        input { background: #fff; color: #000; }
        button {
            background: #0064c9;
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .5; }
        #output {
            white-space: pre-wrap;
            background: #f5f5f5;
            color: #000;
            padding: 1em;
            border-radius: 8px;
            margin-top: 1em;
            max-height: 60vh;
            overflow: auto;
            font-size: 1rem;
            line-height: 1.5;
        }
        #progressContainer {
            display: none;
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 1em 0;
            overflow: hidden;
        }
        #progressBar {
            width: 100%;
            height: 100%;
            background: #0064c9;
            animation: progressAnim 2s infinite;
        }
        @keyframes progressAnim {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
    </style>
</head>
<body>
    <h2>🇭🇷 Anagrami imena i prezimena</h2>
    <p style="text-align:center;opacity:.7">Autor: Damir Magdić</p>
    <input id="ime" placeholder="Ime">
    <input id="prezime" placeholder="Prezime">
    <button id="btn1" onclick="trazi(1)">Anagram s jednom riječju</button>
    <button id="btn2" onclick="trazi(2)">Anagrami s dvije riječi</button>
    <button id="btn3" onclick="trazi(3)">Anagrami s tri riječi</button>
    <button id="loadBtn" onclick="loadBigDict()" style="background:#333;font-weight:400">Učitaj prošireni rječnik (50k+ riječi)</button>
    <div id="progressContainer"><div id="progressBar"></div></div>
    <div id="output">Unesite ime i prezime pa kliknite na jedan od gumba. Za više rezultata učitajte prošireni rječnik".</div>

    <script>
        const smallDict = ["a","ali","ako","ba","bar","bih","bio","biti","bog","bol","brat","broj","budem","budi","cesta","cure","čaj","čekati","čovjek","će","ću","da","dan","dana","dati","dio","djece","djeca","dobro","doći","dok","dom","dosta","drugo","drugi","država","dugo","dva","dvije","evo","film","gaj","gdje","glas","glava","godina","grad","hrana","hrvatska","htjeti","i","iako","ili","imati","ime","inače","ipak","ispod","isto","iz","između","ja","jako","jedan","jedna","jedno","je","jer","jezik","joj","još","jutro","kao","kad","kako","kamo","kat","kaže","kiša","klima","knjiga","koga","koliko","kome","konj","kraj","kroz","kruh","kuća","kupiti","kvadrat","lako","led","lijepo","ljeto","ljubav","ma","majka","malo","me","među","mi","mjesto","mlad","mnogo","moć","mogu","mora","more","možda","mu","na","naj","nama","narod","nas","naš","ne","nego","neki","nema","ni","nije","nisu","noć","novi","novo","nje","njega","njih","njoj","no","nos","o","od","odmah","on","ona","one","oni","ono","opet","osim","otac","ovaj","ovo","pa","pet","pio","piti","po","pod","pogled","pokraj","pol","pola","policija","ponovo","posao","poslije","potreba","prvi","put","puta","rad","raditi","rat","reći","riječ","rijeka","ruka","s","sa","sad","sam","samo","sestra","se","sin","sinoć","slika","sloboda","slovo","smrt","snaga","soba","sport","srce","sredina","stol","stranka","student","sunce","sutra","svaki","sve","svijet","svjetlo","taj","tako","tamo","te","tema","temelj","ti","tjedan","to","treba","tri","tu","tvoj","u","ući","ulica","umjetnost","upravo","ustav","učiti","vani","velik","vi","vidjeti","vino","voda","vojnik","vrat","vrijeme","vrlo","vrt","zadnji","zar","zašto","zbog","zdravlje","zemlja","zimi","znati","žena","život"];
        let wordSet = new Set(smallDict);

        function getL(s) { return s.toLowerCase().replace(/\s/g,'').normalize('NFC'); }
        function cnt(s) { const o={}; for(let c of s) o[c]=(o[c]||0)+1; return o; }
        function can(w,a) { for(let c in w) if(!a[c]||a[c]<w[c]) return !1; return !0; }
        function isEmpty(o) { return Object.keys(o).length===0; }
        function subtract(a,b) { const r={...a}; for(let c in b) { r[c]-=b[c]; if(r[c]<=0) delete r[c]; } return r; }

        async function loadBigDict() {
            const btn = document.getElementById('loadBtn'), o = document.getElementById('output');
            btn.disabled = !0;
            o.innerHTML = '<p>Učitavam veliki rječnik...</p>';
            try {
                const r = await fetch('https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2016/hr/hr_50k.txt');
                if(!r.ok) throw Error('HTTP '+r.status);
                const t = await r.text(), ns = new Set(smallDict);
                t.split(/\n/).forEach(l => {
                    const w = l.split(/\s+/)[0];
                    if(w && /^[a-zčćđšž]+$/i.test(w)) ns.add(w.toLowerCase());
                });
                wordSet = ns;
                o.innerHTML = '<p>Učitano '+ns.size.toLocaleString('hr')+' riječi. Možete pretraživati.</p>';
            } catch(e) {
                o.innerHTML = '<p>Greška: '+e.message+'</p>';
            } finally { btn.disabled = !1; }
        }

        function trazi(maxWords) {
            const ime = document.getElementById('ime').value.trim(),
                  prezime = document.getElementById('prezime').value.trim(),
                  o = document.getElementById('output'),
                  prog = document.getElementById('progressContainer'),
                  btn1 = document.getElementById('btn1'),
                  btn2 = document.getElementById('btn2'),
                  btn3 = document.getElementById('btn3');
            if(!ime || !prezime) { o.innerHTML = '<p>Unesite ime i prezime.</p>'; return; }
            const s = getL(ime+prezime), target = cnt(s);
            if(isEmpty(target)) { o.innerHTML = '<p>Nema slova.</p>'; return; }

            btn1.disabled = btn2.disabled = btn3.disabled = !0;
            prog.style.display = 'block';
            o.innerHTML = '<p>Tražim anagrame...</p>';

            const candidates = [];
            for(let w of wordSet) {
                if(w.length<2) continue;
                const wc = cnt(w);
                if(can(wc,target)) candidates.push({word:w, cnt:wc});
            }

            if(maxWords === 1) {
                const single = candidates.filter(c => {
                    if(Object.keys(c.cnt).length !== Object.keys(target).length) return !1;
                    for(let k in target) if(c.cnt[k] !== target[k]) return !1;
                    return !0;
                }).map(c => c.word);
                prog.style.display = 'none';
                btn1.disabled = btn2.disabled = btn3.disabled = !1;
                if(single.length) {
                    o.innerHTML = '<h3>Anagrami s jednom riječju:</h3><ul>'+single.map(w=>'<li>'+w+'</li>').join('')+'</ul>';
                } else {
                    o.innerHTML = '<p>Nema prihvatljivih anagrama.</p>';
                }
                return;
            }

            const multi = [];
            const stack = [];
            for(let i=0; i<candidates.length; i++) {
                const rem = subtract(target, candidates[i].cnt);
                stack.push({idx:i, rem, path:[candidates[i].word], nextIdx:i+1});
            }
            const startTime = Date.now(), timeLimit = 5000;

            function processChunk() {
                let steps = 0;
                while(stack.length && steps<1000 && multi.length<500) {
                    const item = stack.pop();
                    if(isEmpty(item.rem)) {
                        if(item.path.length === maxWords) multi.push(item.path);
                        steps++;
                        continue;
                    }
                    if(item.path.length >= maxWords) continue;
                    for(let i=item.nextIdx; i<candidates.length; i++) {
                        const w = candidates[i];
                        if(!can(w.cnt, item.rem)) continue;
                        const newRem = subtract(item.rem, w.cnt);
                        stack.push({idx:i, rem:newRem, path:item.path.concat(w.word), nextIdx:i+1});
                        steps++;
                        if(steps>=1000) break;
                    }
                }
                if(stack.length && (Date.now()-startTime)<timeLimit && multi.length<500) {
                    requestAnimationFrame(processChunk);
                    return;
                }
                prog.style.display = 'none';
                btn1.disabled = btn2.disabled = btn3.disabled = !1;
                const label = maxWords===2 ? 'dvije' : 'tri';
                if(multi.length) {
                    o.innerHTML = '<h3>Anagrami s '+label+' riječi ('+multi.length+'):</h3><ul>'+
                        multi.slice(0,100).map(a=>'<li>'+a.join(' + ')+'</li>').join('')+
                        (multi.length>100 ? '<li>... i još '+(multi.length-100)+' kombinacija</li>' : '')+
                        '</ul>';
                } else {
                    o.innerHTML = '<p>Nema prihvatljivih anagrama.</p>';
                }
            }
            requestAnimationFrame(processChunk);
        }
    </script>
</body>
</html>
