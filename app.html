<html lang="hr">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Anagram HR">
    <meta name="mobile-web-app-capable" content="yes">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #a0a0b0;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .name-inputs {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e94560;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .anagram-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-anagram {
            padding: 14px 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-anagram:hover:not(:disabled) {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.3);
        }

        .btn-anagram.active {
            background: linear-gradient(135deg, #e94560, #c23152);
            border-color: #e94560;
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.5);
        }

        .btn-anagram:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-anagram .emoji {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .progress-container {
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b, #ffa502);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #a0a0b0;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            color: #ffa502;
            font-size: 0.8rem;
        }

        .results-container {
            margin-top: 25px;
            display: none;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-count {
            color: #ffa502;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .results-info {
            color: #a0a0b0;
            font-size: 0.85rem;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-clear:hover {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }

        .anagram-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .anagram-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 500;
            animation: fadeIn 0.5s ease;
            cursor: pointer;
            word-break: break-word;
        }

        .anagram-item:hover {
            background: rgba(233, 69, 96, 0.3);
            transform: scale(1.05) translateY(-2px);
            border-color: #e94560;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
        }

        .anagram-item.single-word {
            background: rgba(255, 165, 2, 0.2);
            border-color: rgba(255, 165, 2, 0.4);
        }

        .anagram-item.two-words {
            background: rgba(0, 168, 255, 0.2);
            border-color: rgba(0, 168, 255, 0.4);
        }

        .anagram-item.three-words {
            background: rgba(0, 206, 209, 0.2);
            border-color: rgba(0, 206, 209, 0.4);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-results {
            text-align: center;
            color: #a0a0b0;
            padding: 30px;
            font-style: italic;
            grid-column: 1 / -1;
        }

        .source-info {
            margin-top: 20px;
            text-align: center;
            color: #a0a0b0;
            font-size: 0.8rem;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;

            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            padding: 15px;
            border-radius: 12px;

            font-size: 0.85rem;

            color: #ffa502;

        .anagram-grid::-webkit-scrollbar {
            width: 8px;
        }

        .anagram-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .anagram-grid::-webkit-scrollbar-thumb {
            background: rgba(233, 69, 96, 0.5);
            border-radius: 10px;
        }

        .anagram-grid::-webkit-scrollbar-thumb:hover {
            background: rgba(233, 69, 96, 0.8);
        }

            .container {

                font-size: 2rem;
            }

                flex-direction: column;
            }
            
            .anagram-buttons {
                grid-template-columns: 1fr;
            }
            
            .anagram-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                max-height: 400px;
            }
            
            .btn-anagram {
                padding: 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Anagram HR</h1>
        <p class="subtitle">Pronađite sve anagrame vašeg imena i prezimena na hrvatskom jeziku</p>

        </div>

        <div class="input-group">
            <div class="name-inputs">

                    <label for="ime">Ime</label>
                    <input type="text" id="ime" placeholder="Unesite ime..." autocomplete="off">
                </div>
                <div class="input-field">
                    <label for="prezime">Prezime</label>
                    <input type="text" id="prezime" placeholder="Unesite prezime..." autocomplete="off">
                </div>
            </div>
            
            <div class="anagram-buttons">
                <button class="btn-anagram active" id="btnSingleWord">
                    <span class="emoji">1️⃣</span>
                    Anagram s jednom riječi
                </button>
                <button class="btn-anagram" id="btnTwoWords">

        <div class="results-container" id="resultsContainer">

            <div class="anagram-grid" id="anagramGrid"></div>

        </div>

        // Funkcije za generiranje anagrama
        function mozesSlozitiRijec(dostupnaSlova, ciljanaSlova) {
            const tempSlova = [...dostupnaSlova];
            for (const slovo of ciljanaSlova) {
                const index = tempSlova.indexOf(slovo);
                if (index === -1) return false;
                tempSlova.splice(index, 1);
            }
            return true;
        }

        function ukloniSlova(slova, slovaZaUkloniti) {
            const rezultat = [...slova];
            for (const slovo of slovaZaUkloniti) {
                const index = rezultat.indexOf(slovo);
                if (index !== -1) {
                    rezultat.splice(index, 1);
                }
            }
            return rezultat;
        }

        function generirajAnagrameJednaRijec(slova) {
            const anagrami = new Set();
            HRVATSKI_RJECNIK.forEach(rijec => {
                const rijecSlova = rijec.toLowerCase().split('').sort();
                if (rijecSlova.length === slova.length && 
                    mozesSlozitiRijec(slova, rijecSlova)) {
                    anagrami.add(rijec);
                }
            });
            return Array.from(anagrami).sort();
        }

        function generirajAnagrameDvijeRijeci(slova) {
            const anagrami = new Set();
            const rijeciArray = Array.from(HRVATSKI_RJECNIK);
            
            for (let i = 0; i < rijeciArray.length; i++) {
                const prvaRijec = rijeciArray[i];
                const prvaSlova = prvaRijec.toLowerCase().split('').sort();
                
                if (!mozesSlozitiRijec(slova, prvaSlova)) continue;
                
                const preostalaSlova = ukloniSlova([...slova], prvaSlova);
                
                for (let j = 0; j < rijeciArray.length; j++) {
                    const drugaRijec = rijeciArray[j];
                    const drugaSlova = drugaRijec.toLowerCase().split('').sort();
                    
                    if (preostalaSlova.length === drugaSlova.length &&
                        mozesSlozitiRijec(preostalaSlova, drugaSlova)) {
                        const kombinacija = [prvaRijec, drugaRijec].sort().join(' ');
                        anagrami.add(kombinacija);
                    }
                }
            }
            
            return Array.from(anagrami).sort();
        }

        function generirajAnagrameTriRijeci(slova) {
            const anagrami = new Set();
            const rijeciArray = Array.from(HRVATSKI_RJECNIK);
            
            for (let i = 0; i < rijeciArray.length; i++) {
                const prvaRijec = rijeciArray[i];
                const prvaSlova = prvaRijec.toLowerCase().split('').sort();
                
                if (!mozesSlozitiRijec(slova, prvaSlova)) continue;
                
                const ostatak1 = ukloniSlova([...slova], prvaSlova);
                
                for (let j = 0; j < rijeciArray.length; j++) {
                    const drugaRijec = rijeciArray[j];
                    const drugaSlova = drugaRijec.toLowerCase().split('').sort();
                    
                    if (!mozesSlozitiRijec(ostatak1, drugaSlova)) continue;
                    
                    const ostatak2 = ukloniSlova([...ostatak1], drugaSlova);
                    
                    for (let k = 0; k < rijeciArray.length; k++) {
                        const trecaRijec = rijeciArray[k];
                        const trecaSlova = trecaRijec.toLowerCase().split('').sort();
                        
                        if (ostatak2.length === trecaSlova.length &&
                            mozesSlozitiRijec(ostatak2, trecaSlova)) {
                            const kombinacija = [prvaRijec, drugaRijec, trecaRijec].sort().join(' ');
                            anagrami.add(kombinacija);
                        }
                    }
                }
            }
            
            return Array.from(anagrami).sort();
        }

        // UI Funkcije
        function updateDictionaryCount() {
            document.getElementById('dictionaryCount').textContent = 
                HRVATSKI_RJECNIK.size.toLocaleString();
        }

        function setActiveButton(mod) {
            document.querySelectorAll('.btn-anagram').forEach(btn => {
                btn.classList.remove('active');
            });
            
            switch(mod) {
                case 'single':
                    document.getElementById('btnSingleWord').classList.add('active');
                    break;
                case 'double':
                    document.getElementById('btnTwoWords').classList.add('active');
                    break;
                case 'triple':
                    document.getElementById('btnThreeWords').classList.add('active');
                    break;
            }
            
            trenutniMod = mod;
        }

        async function pokreniGeneriranje() {
            if (isGenerating) return;
            
            const ime = document.getElementById('ime').value.trim();
            const prezime = document.getElementById('prezime').value.trim();
            
            if (!ime || !prezime) {
                alert('Molimo unesite i ime i prezime!');
                return;
            }

            isGenerating = true;
            
            // Onemogući sve gumbe
            document.querySelectorAll('.btn-anagram').forEach(btn => {
                btn.disabled = true;
            });

            // Prikaži progress bar
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const progressPercentage = document.getElementById('progressPercentage');
            const progressFound = document.getElementById('progressFound');
            
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressPercentage.textContent = '0%';
            progressFound.textContent = 'Pronađeno: 0';

            const punoIme = (ime + ' ' + prezime).toLowerCase();
            const slova = punoIme.replace(/\s/g, '').split('').sort();
            
            let anagrami = [];
            
            // Simuliraj progres za bolji UX
            const updateProgress = (percentage, found) => {
                progressFill.style.width = percentage + '%';
                progressPercentage.textContent = Math.round(percentage) + '%';
                progressFound.textContent = 'Pronađeno: ' + found;
            };

            updateProgress(5, 0);
            progressText.textContent = 'Analiziram slova...';
            
            await new Promise(resolve => setTimeout(resolve, 300));
            updateProgress(15, 0);
            
            switch(trenutniMod) {
                case 'single':
                    progressText.textContent = 'Generiram anagrame s jednom riječi...';
                    updateProgress(25, 0);
                    anagrami = generirajAnagrameJednaRijec(slova);
                    updateProgress(90, anagrami.length);
                    break;
                    
                case 'double':
                    progressText.textContent = 'Generiram anagrame s dvije riječi...';
                    updateProgress(20, 0);
                    
                    // Simuliraj progres tijekom generiranja
                    const dvijeRijeciInterval = setInterval(() => {
                        const currentWidth = parseFloat(progressFill.style.width) || 20;
                        if (currentWidth < 80) {
                            updateProgress(currentWidth + 5, 0);
                        }
                    }, 200);
                    
                    anagrami = generirajAnagrameDvijeRijeci(slova);
                    clearInterval(dvijeRijeciInterval);
                    updateProgress(90, anagrami.length);
                    break;
                    
                case 'triple':
                    progressText.textContent = 'Generiram anagrame s tri riječi...';
                    updateProgress(15, 0);
                    
                    const triRijeciInterval = setInterval(() => {
                        const currentWidth = parseFloat(progressFill.style.width) || 15;
                        if (currentWidth < 85) {
                            updateProgress(currentWidth + 3, 0);
                        }
                    }, 300);
                    
                    anagrami = generirajAnagrameTriRijeci(slova);
                    clearInterval(triRijeciInterval);
                    updateProgress(90, anagrami.length);
                    break;
            }
            
            updateProgress(100, anagrami.length);
            progressText.textContent = 'Završeno!';
            
            setTimeout(() => {
                progressContainer.style.display = 'none';
                prikaziRezultate(anagrami, punoIme);
                
                // Omogući gumbe natrag
                document.querySelectorAll('.btn-anagram').forEach(btn => {
                    btn.disabled = false;
                });
                
                isGenerating = false;
            }, 500);
        }

        function prikaziRezultate(anagrami, originalniTekst) {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsCount = document.getElementById('resultsCount');
            const resultsInfo = document.getElementById('resultsInfo');
            const anagramGrid = document.getElementById('anagramGrid');

            resultsContainer.style.display = 'block';
            
            let modTekst = '';
            let cssClass = '';
            switch(trenutniMod) {
                case 'single':
                    modTekst = 'jednom riječi';
                    cssClass = 'single-word';
                    break;
                case 'double':
                    modTekst = 'dvije riječi';
                    cssClass = 'two-words';
                    break;
                case 'triple':
                    modTekst = 'tri riječi';
                    cssClass = 'three-words';
                    break;
            }
            
            resultsCount.textContent = `Pronađeno ${anagrami.length} anagrama`;
            resultsInfo.textContent = `za "${originalniTekst}" (${modTekst})`;
            
            if (anagrami.length > 0) {
                anagramGrid.innerHTML = anagrami.map(anagram => 
                    `<div class="anagram-item ${cssClass}">${anagram}</div>`
                ).join('');
            } else {
                anagramGrid.innerHTML = '<div class="no-results">Nema pronađenih anagrama. Pokušajte s drugim imenom i prezimenom ili promijenite vrstu anagrama.</div>';
            }
        }

        function ocistiRezultate() {
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('anagramGrid').innerHTML = '';
        }

        // Event listeneri
        document.getElementById('btnSingleWord').addEventListener('click', () => {
            setActiveButton('single');
            pokreniGeneriranje();
        });

        document.getElementById('btnTwoWords').addEventListener('click', () => {
            setActiveButton('double');
            pokreniGeneriranje();
        });

        document.getElementById('btnThreeWords').addEventListener('click', () => {
            setActiveButton('triple');
            pokreniGeneriranje();
        });

        document.getElementById('clearBtn').addEventListener('click', ocistiRezultate);

        // Enter key support
        document.getElementById('ime').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('prezime').focus();
            }
        });
        document.getElementById('prezime').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                pokreniGeneriranje();
            }
        });

        // PWA Install prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').style.display = 'block';
        });

        document.getElementById('installPrompt').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                console.log(`User response: ${result.outcome}`);
                deferredPrompt = null;
                document.getElementById('installPrompt').style.display = 'none';
            }
        });

        // Inicijalizacija aplikacije
        async function inicijalizirajAplikaciju() {
            console.log('Inicijalizacija Anagram HR aplikacije...');
            
            // Dohvati riječi s web stranica
            HRVATSKI_RJECNIK = await dohvatiRijeciSaWeba();
            
            // Ažuriraj prikaz broja riječi
            updateDictionaryCount();
            
            console.log(`Aplikacija spremna! Rječnik sadrži ${HRVATSKI_RJECNIK.size} riječi.`);
        }

        // Pokreni inicijalizaciju
        inicijalizirajAplikaciju();
    </script>
</body>
</html>
