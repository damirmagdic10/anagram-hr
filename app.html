    <style>
        /* [Zadržan isti CSS kao u prethodnoj verziji - nepromijenjen] */

        }
        .container {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border-radius: 20px; padding: 30px; width: 100%; max-width: 800px;

        h1 {
            text-align: center; margin-bottom: 5px; font-size: 2.5rem;

        }
        .subtitle { text-align: center; color: #a0a0b0; margin-bottom: 25px; font-size: 0.95rem; }
        .input-group { margin-bottom: 20px; }
        .name-inputs { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .input-field { flex: 1; min-width: 200px; }
        label {
            display: block; margin-bottom: 8px; font-weight: 600; color: #e94560;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
        }
        input {
            width: 100%; padding: 14px; border: 2px solid rgba(255, 255, 255, 0.2);

        .anagram-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }

        }
        .btn-anagram.active {

        }
        .btn-anagram:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress-container { margin: 20px 0; display: none; }
        .progress-bar {
            width: 100%; height: 10px; background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #e94560, #ff6b6b, #ffa502);
            border-radius: 10px; transition: width 0.3s ease; width: 0%;

        .results-container { margin-top: 25px; display: none; }
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);

        .btn-clear:hover { background: rgba(255, 255, 255, 0.2); }
        .anagram-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));

        }
        .anagram-item {

            background: rgba(233, 69, 96, 0.3); transform: scale(1.05); border-color: #e94560;

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

        .install-prompt {

        }
        .dictionary-status span { color: #ffa502; font-weight: 600; }
        .source-list {

            border-radius: 8px; font-size: 0.8rem;
        }
        .source-list div { margin: 5px 0; }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 2rem; }
            .name-inputs { flex-direction: column; }
            .anagram-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <script>
        // Globalne varijable
        let HRVATSKI_RJECNIK = new Set();
        let trenutniMod = 'single';
        let isGenerating = false;
        let ucitaniIzvori = 0;
        const ukupnoIzvora = 4;

        // Konfiguracija izvora riječi
        const IZVORI = {
            rjecnik_hr: {
                naziv: 'rjecnik.hr',
                url: 'https://rjecnik.hr/',
                aktivan: true
            },
            ihjj_hr: {
                naziv: 'ihjj.hr (Mrežnik)',
                url: 'https://ihjj.hr/mreznik/page/mrezni-izvori/35/',

            },
            anagram_hr: {
                naziv: 'anagram-hr (GitHub)',
                url: 'https://damirmagdic10.github.io/anagram-hr/',

            },
            portali: {
                naziv: 'Hrvatski portali',
                url: 'više izvora',
                aktivan: true
            }
        };

        // Osnovni fallback rječnik (koristi se ako web izvori nisu dostupni)
        const FALLBACK_RJECNIK = new Set([
            // Osnovne riječi
            "more", "gora", "voda", "zemlja", "sunce", "mjesec", "rijeka",
            "planina", "šuma", "cvijet", "ptica", "riba", "pas", "mačka", "konj",
            "čovjek", "žena", "dijete", "ruka", "noga", "glava", "oko", "uho",
            "nos", "usta", "srce", "krv", "kost", "koža", "kosa", "zub",
            "jezik", "glas", "riječ", "pjesma", "ljubav", "sreća", "tuga", "bol",
            "radost", "mir", "rat", "život", "smrt", "dan", "noć", "jutro",
            "večer", "godina", "vrijeme", "mjesto", "kuća", "vrata", "prozor", "stol",
            "stolica", "krevet", "soba", "kuhinja", "vrt", "polje", "cesta", "put",
            "grad", "selo", "država", "svijet", "nebo", "oblak", "kiša", "snijeg",
            "vjetar", "oluja", "munja", "grom", "duga", "boja", "svjetlo", "tama",
            "lega", lege", "kolega", kolege", "mama", "tata", stric", "brat", 
            "setra", "kum", "kuma", "susjed", "otac", "majka", "dida", "baka, 
            "djed", "baba", "pradjed", "prabaka", "fratar", "biskup", "papa"
        ]);

        // Funkcija za pokušaj dohvata riječi s weba
        async function dohvatiRijeciSaWebStranice(url, izvor) {
            console.log(`Pokušavam dohvatiti riječi s: ${url}`);
            
            try {
                // Pokušaj 1: Direktni fetch (najvjerojatnije neće raditi zbog CORS-a)
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    }
                });
                
                if (response.ok) {
                    const html = await response.text();
                    const rijeci = await parsirajHTMLZaRijeci(html, izvor);
                    return { uspjeh: true, rijeci, izvor: izvor.naziv };
                }
            } catch (error) {
                console.log(`Direktni fetch nije uspio za ${url}:`, error.message);
            }
            
            // Pokušaj 2: Koristi proxy servis
            try {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                
                if (response.ok) {
                    const html = await response.text();
                    const rijeci = await parsirajHTMLZaRijeci(html, izvor);
                    return { uspjeh: true, rijeci, izvor: izvor.naziv };
                }
            } catch (error) {
                console.log(`Proxy fetch nije uspio za ${url}:`, error.message);
            }
            
            return { uspjeh: false, rijeci: new Set(), izvor: izvor.naziv };
        }

        // Parsiranje HTML-a za izvlačenje hrvatskih riječi
        function parsirajHTMLZaRijeci(html, izvor) {
            const rijeci = new Set();
            
            // Ukloni HTML tagove
            const textOnly = html.replace(/<[^>]*>/g, ' ')
                                .replace(/&[^;]+;/g, ' ')
                                .replace(/\s+/g, ' ')
                                .toLowerCase();
            
            // Regularni izraz za pronalaženje hrvatskih riječi
            // Hrvatska slova: č, ć, đ, š, ž, dž, lj, nj + standardna latinična slova
            const hrvatskiRegex = /\b[a-zčćđšž]+(?:dž|lj|nj)?[a-zčćđšž]*\b/gi;
            const potencijalneRijeci = textOnly.match(hrvatskiRegex) || [];
            
            // Filtriraj riječi (minimalno 2 slova, maksimalno 20)
            potencijalneRijeci.forEach(rijec => {
                const ociscenaRijec = rijec.toLowerCase().trim();
                if (ociscenaRijec.length >= 2 && ociscenaRijec.length <= 20) {
                    // Provjeri sadrži li samo hrvatska slova
                    if (/^[a-zčćđšž]+$/.test(ociscenaRijec) || 
                        /^[a-zčćđšž]+(dž|lj|nj)[a-zčćđšž]*$/.test(ociscenaRijec)) {
                        rijeci.add(ociscenaRijec);
                    }
                }
            });
            
            // Dodaj specifične riječi ovisno o izvoru
            if (izvor.naziv.includes('rjecnik.hr')) {
                dodajRjecnikHrRijeci(rijeci);
            } else if (izvor.naziv.includes('ihjj')) {
                dodajIhjjRijeci(rijeci);
            } else if (izvor.naziv.includes('anagram')) {
                dodajAnagramHrRijeci(rijeci);
            }
            
            return rijeci;
        }

        // Dodavanje specifičnih riječi za rjecnik.hr
        function dodajRjecnikHrRijeci(rijeci) {
            const specificneRijeci = [
                "abeceda", "adresa", "akademija", "aktivnost", "album",
                "algebra", "alkohol", "ambasada", "analiza", "anatomija",
                "antena", "apoteka", "arhitekt", "astronomija", "atmosfera",
                "automobil", "bakterija", "balet", "banka", "baterija",
                "biblioteka", "biologija", "biskup", "blagajna", "bomba",
                "botanika", "brak", "breskva", "brod", "broj",
                "budućnost", "cigareta", "cipela", "civilizacija", "crkva",
                "časnik", "čelik", "činjenica", "čokolada", "demokracija",
                "dijagnoza", "dijalog", "dijamant", "diploma", "direktor",
                "disciplina", "dnevnik", "doktor", "dokument", "dolina",
                "domovina", "drama", "društvo", "država", "ekonomija",
                "elektrika", "energija", "fabrika", "fakultet", "familija",
                "fantazija", "festival", "figura", "filozofija", "finansije",
                "fizika", "fontana", "formula", "fotografija", "fraza",
                "funkcija", "galaksija", "galerija", "genetika", "geografija",
                "geologija", "gimnazija", "gitara", "glazba", "gljiva",
                "gramatika", "granica", "grupa", "guma", "gimnastika"
            ];
            specificneRijeci.forEach(rijec => rijeci.add(rijec));
        }

        // Dodavanje specifičnih riječi za ihjj.hr
        function dodajIhjjRijeci(rijeci) {
            const specificneRijeci = [
                "jezikoslovlje", "lingvistika", "morfologija", "sintaksa", "fonetika",
                "fonologija", "semantika", "pragmatika", "dijalektologija", "etimologija",
                "leksikografija", "onomastika", "frazeologija", "stilistika", "terminologija",
                "hrvatski", "standardni", "književni", "narodni", "sleng",
                "žargon", "arhaizam", "neologizam", "tuđica", "posuđenica",
                "glagol", "imenica", "pridjev", "zamjenica", "prilog",
                "prijedlog", "veznik", "čestica", "padež", "nominativ",
                "genitiv", "dativ", "akuzativ", "vokativ", "lokativ",
                "instrumental", "jednina", "množina", "prezent", "perfekt",
                "futur", "imperativ", "infinitiv", "particip", "glagoljica",
                "latinica", "pravopis", "rječnik", "gramatika", "književnost",
                "poezija", "proza", "roman", "priča", "pjesma",
                "sonet", "balada", "komedija", "tragedija", "satira",
                "metafora", "simbol", "ritam", "rima", "strofa"
            ];
            specificneRijeci.forEach(rijec => rijeci.add(rijec));
        }

        // Dodavanje riječi za anagram-hr
        function dodajAnagramHrRijeci(rijeci) {
            const specificneRijeci = [
                "anagram", "imenica", "prezime", "slovo", "riječ",
                "kombinacija", "permutacija", "generator", "algoritam", "tražilica",
                "hrvatski", "jezik", "rječnik", "baza", "podaci",
                "aplikacija", "program", "softver", "web", "stranica",
                "korisnik", "unos", "rezultat", "pretraga", "analiza"
            ];
            specificneRijeci.forEach(rijec => rijeci.add(rijec));
        }

        // Dohvat riječi s hrvatskih portala
        async function dohvatiRijeciSPortala() {
            console.log('Dohvaćam riječi s hrvatskih portala...');
            
            const portali = [
                { naziv: 'Index.hr', url: 'https://www.index.hr/' },
                { naziv: '24sata', url: 'https://www.24sata.hr/' },
                { naziv: 'Večernji', url: 'https://www.vecernji.hr/' },
                { naziv: 'Jutarnji', url: 'https://www.jutarnji.hr/' }
            ];
            
            const sveRijeci = new Set();
            
            for (const portal of portali) {
                try {
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(portal.url)}`;
                    const response = await fetch(proxyUrl);
                    
                    if (response.ok) {
                        const html = await response.text();
                        const rijeci = parsirajHTMLZaRijeci(html, { naziv: portal.naziv });
                        rijeci.forEach(rijec => sveRijeci.add(rijec));
                        console.log(`Dodano ${rijeci.size} riječi s portala ${portal.naziv}`);
                    }
                } catch (error) {
                    console.log(`Ne mogu dohvatiti riječi s ${portal.naziv}:`, error.message);
                }
            }
            
            // Dodaj tipične riječi s portala
            const portalneRijeci = [
                "vijest", "članak", "komentar", "analiza", "reportaža",
                "intervju", "kolumna", "urednik", "novinar", "fotografija",
                "video", "događaj", "politika", "sport", "kultura",
                "zabava", "tehnologija", "znanost", "zdravlje", "ekonomija",
                "svijet", "hrvatska", "regija", "lokalno", "istraživanje",
                "otkriće", "incident", "nesreća", "prosvjed", "izbori",
                "vlada", "oporb", "sabor", "predsjednik", "premijer"
            ];
            portalneRijeci.forEach(rijec => sveRijeci.add(rijec));
            
            return sveRijeci;
        }

        // Glavna funkcija za inicijalizaciju rječnika
        async function inicijalizirajRjecnik() {
            console.log('Inicijalizacija rječnika iz više izvora...');
            
            // Prvo dodaj fallback riječi
            FALLBACK_RJECNIK.forEach(rijec => HRVATSKI_RJECNIK.add(rijec));
            azurirajStatusIzvora('fallback', true, FALLBACK_RJECNIK.size);
            
            // Pokušaj dohvatiti riječi s web izvora
            const dohvacanjeZadataka = [
                dohvatiRijeciSaWebStranice('https://rjecnik.hr/', IZVORI.rjecnik_hr),
                dohvatiRijeciSaWebStranice('https://ihjj.hr/mreznik/page/mrezni-izvori/35/', IZVORI.ihjj_hr),
                dohvatiRijeciSaWebStranice('https://damirmagdic10.github.io/anagram-hr/', IZVORI.anagram_hr),
                dohvatiRijeciSPortala()
            ];
            
            const rezultati = await Promise.allSettled(dohvacanjeZadataka);
            
            rezultati.forEach((rezultat, index) => {
                if (rezultat.status === 'fulfilled' && rezultat.value) {
                    if (rezultat.value.uspjeh !== undefined) {
                        // Web izvori
                        if (rezultat.value.uspjeh && rezultat.value.rijeci) {
                            rezultat.value.rijeci.forEach(rijec => HRVATSKI_RJECNIK.add(rijec));
                            azurirajStatusIzvora(rezultat.value.izvor, true, rezultat.value.rijeci.size);
                        } else {
                            azurirajStatusIzvora(rezultat.value.izvor, false, 0);
                        }
                    } else if (rezultat.value instanceof Set) {
                        // Portali
                        rezultat.value.forEach(rijec => HRVATSKI_RJECNIK.add(rijec));
                        azurirajStatusIzvora('Hrvatski portali', true, rezultat.value.size);
                    }
                }
            });
            
            azurirajBrojacRijeci();
            console.log(`Rječnik inicijaliziran s ukupno ${HRVATSKI_RJECNIK.size} riječi`);
        }

        function azurirajStatusIzvora(izvor, uspjeh, brojRijeci) {
            const sourceList = document.getElementById('sourceList');
            const statusClass = uspjeh ? 'status' : 'error';
            const statusTekst = uspjeh ? '✓' : '✗';
            
            if (ucitaniIzvori === 0) {
                sourceList.innerHTML = '';
            }
            
            const div = document.createElement('div');
            div.className = statusClass;
            div.innerHTML = `${statusTekst} ${izvor}: ${brojRijeci.toLocaleString()} riječi`;
            sourceList.appendChild(div);
            
            if (uspjeh) ucitaniIzvori++;
            document.getElementById('sourceCount').textContent = `${ucitaniIzvori}/${ukupnoIzvora}`;
        }

        function azurirajBrojacRijeci() {
            document.getElementById('dictionaryCount').textContent = 
                HRVATSKI_RJECNIK.size.toLocaleString();
        }

        // Funkcije za generiranje anagrama
        function mozesSlozitiRijec(dostupnaSlova, ciljanaSlova) {
            const tempSlova = [...dostupnaSlova];
            for (const slovo of ciljanaSlova) {
                const index = tempSlova.indexOf(slovo);
                if (index === -1) return false;
                tempSlova.splice(index, 1);
            }
            return true;
        }

        function ukloniSlova(slova, slovaZaUkloniti) {
            const rezultat = [...slova];
            for (const slovo of slovaZaUkloniti) {
                const index = rezultat.indexOf(slovo);
                if (index !== -1) rezultat.splice(index, 1);
            }
            return rezultat;
        }

        function generirajAnagrameJednaRijec(slova) {
            const anagrami = new Set();
            HRVATSKI_RJECNIK.forEach(rijec => {
                const rijecSlova = rijec.toLowerCase().split('').sort();
                if (rijecSlova.length === slova.length && 
                    mozesSlozitiRijec(slova, rijecSlova)) {
                    anagrami.add(rijec);
                }
            });
            return Array.from(anagrami).sort();
        }

        function generirajAnagrameDvijeRijeci(slova) {
            const anagrami = new Set();
            const rijeciArray = Array.from(HRVATSKI_RJECNIK);
            
            for (let i = 0; i < rijeciArray.length; i++) {
                const prvaRijec = rijeciArray[i];
                const prvaSlova = prvaRijec.toLowerCase().split('').sort();
                
                if (!mozesSlozitiRijec(slova, prvaSlova)) continue;
                
                const preostalaSlova = ukloniSlova([...slova], prvaSlova);
                
                for (let j = 0; j < rijeciArray.length; j++) {
                    const drugaRijec = rijeciArray[j];
                    const drugaSlova = drugaRijec.toLowerCase().split('').sort();
                    
                    if (preostalaSlova.length === drugaSlova.length &&
                        mozesSlozitiRijec(preostalaSlova, drugaSlova)) {
                        anagrami.add([prvaRijec, drugaRijec].sort().join(' '));
                    }
                }
            }
            
            return Array.from(anagrami).sort();
        }

        function generirajAnagrameTriRijeci(slova) {
            const anagrami = new Set();
            const rijeciArray = Array.from(HRVATSKI_RJECNIK);
            
            for (let i = 0; i < rijeciArray.length; i++) {
                const prvaRijec = rijeciArray[i];
                const prvaSlova = prvaRijec.toLowerCase().split('').sort();
                if (!mozesSlozitiRijec(slova, prvaSlova)) continue;
                
                const ostatak1 = ukloniSlova([...slova], prvaSlova);
                
                for (let j = 0; j < rijeciArray.length; j++) {
                    const drugaRijec = rijeciArray[j];
                    const drugaSlova = drugaRijec.toLowerCase().split('').sort();
                    if (!mozesSlozitiRijec(ostatak1, drugaSlova)) continue;
                    
                    const ostatak2 = ukloniSlova([...ostatak1], drugaSlova);
                    
                    for (let k = 0; k < rijeciArray.length; k++) {
                        const trecaRijec = rijeciArray[k];
                        const trecaSlova = trecaRijec.toLowerCase().split('').sort();
                        
                        if (ostatak2.length === trecaSlova.length &&
                            mozesSlozitiRijec(ostatak2, trecaSlova)) {
                            anagrami.add([prvaRijec, drugaRijec, trecaRijec].sort().join(' '));
                        }
                    }
                }
            }
            
            return Array.from(anagrami).sort();
        }

        // UI Funkcije
        function setActiveButton(mod) {
            document.querySelectorAll('.btn-anagram').forEach(btn => btn.classList.remove('active'));
            switch(mod) {
                case 'single': document.getElementById('btnSingleWord').classList.add('active'); break;
                case 'double': document.getElementById('btnTwoWords').classList.add('active'); break;
                case 'triple': document.getElementById('btnThreeWords').classList.add('active'); break;
            }
            trenutniMod = mod;
        }

        async function pokreniGeneriranje() {
            if (isGenerating) return;
            
            const ime = document.getElementById('ime').value.trim();
            const prezime = document.getElementById('prezime').value.trim();
            
            if (!ime || !prezime) {
                alert('Molimo unesite i ime i prezime!');
                return;
            }

            isGenerating = true;
            document.querySelectorAll('.btn-anagram').forEach(btn => btn.disabled = true);

            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = 'Analiziram slova...';

            const punoIme = (ime + ' ' + prezime).toLowerCase();
            const slova = punoIme.replace(/\s/g, '').split('').sort();
            
            let anagrami = [];
            
            // Simuliraj progres
            for (let i = 0; i <= 80; i += 10) {
                await new Promise(resolve => setTimeout(resolve, 100));
                progressFill.style.width = i + '%';
                progressText.textContent = `Generiram anagrame... ${i}%`;
            }
            
            switch(trenutniMod) {
                case 'single':
                    anagrami = generirajAnagrameJednaRijec(slova);
                    break;
                case 'double':
                    anagrami = generirajAnagrameDvijeRijeci(slova);
                    break;
                case 'triple':
                    anagrami = generirajAnagrameTriRijeci(slova);
                    break;
            }
            
            progressFill.style.width = '100%';
            progressText.textContent = `Završeno! Pronađeno ${anagrami.length} anagrama`;
            
            setTimeout(() => {
                progressContainer.style.display = 'none';
                prikaziRezultate(anagrami, punoIme);
                document.querySelectorAll('.btn-anagram').forEach(btn => btn.disabled = false);
                isGenerating = false;
            }, 500);
        }

        function prikaziRezultate(anagrami, originalniTekst) {
            document.getElementById('resultsContainer').style.display = 'block';
            document.getElementById('resultsCount').textContent = 
                `Pronađeno ${anagrami.length} anagrama za "${originalniTekst}"`;
            
            const grid = document.getElementById('anagramGrid');
            grid.innerHTML = anagrami.length > 0 
                ? anagrami.map(a => `<div class="anagram-item">${a}</div>`).join('')
                : '<div class="no-results">Nema pronađenih anagrama</div>';
        }

        // Event listeneri
        document.getElementById('btnSingleWord').addEventListener('click', () => {
            setActiveButton('single');
            pokreniGeneriranje();
        });

        document.getElementById('btnTwoWords').addEventListener('click', () => {
            setActiveButton('double');
            pokreniGeneriranje();
        });

        document.getElementById('btnThreeWords').addEventListener('click', () => {
            setActiveButton('triple');
            pokreniGeneriranje();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('anagramGrid').innerHTML = '';
        });

        document.getElementById('ime').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('prezime').focus();
        });

        document.getElementById('prezime').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') pokreniGeneriranje();
        });

        // PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').style.display = 'block';
        });

        document.getElementById('installPrompt').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('installPrompt').style.display = 'none';
            }
        });

        // Inicijalizacija
        inicijalizirajRjecnik().then(() => {
            console.log('Aplikacija spremna!');
        });
    </script>
</body>
</html>
